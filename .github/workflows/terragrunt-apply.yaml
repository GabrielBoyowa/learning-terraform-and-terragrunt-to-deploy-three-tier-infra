
name: "Terragrunt"

on:
  push:
    branches:
      - main

permissions:
  id-token: write     # Required for OIDC
  contents: read      # Required for checkout        

jobs:
  terragrunt:
    name: "Terragrunt"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Avengers-Endgame

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188735152537:role/GitHub-Actions
          aws-region: us-east-1

      - name: Install Terragrunt
        run: |
          TG_VERSION="0.67.4"
          curl -L https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64 \
            -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Terragrunt Format
        id: fmt
        run: terragrunt hclfmt

      - name: Terragrunt Init
        id: init
        run: terragrunt init

      - name: Terragrunt Plan
        id: plan
        run: terragrunt plan -no-color

      - name: Terragrunt Apply
        run: terragrunt apply --auto-approve








